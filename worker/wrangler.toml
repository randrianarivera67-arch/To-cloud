name = "to-cloud-api"
main = "src/index.js"
compatibility_date = "2025-01-15"
keep_vars = true

# Secrets a definir dans le tableau de bord (type Secret, pas Text) :
#   TELEGRAM_BOT_TOKENS    token1,token2,token3
#   TELEGRAM_CHANNEL_ID    -100xxxxxxxxxx
#   SUPABASE_ANON_KEY      Supabase → API Keys → publishable
#   SUPABASE_SERVICE_KEY   Supabase → API Keys → secret
#
# SUPABASE_JWT_SECRET n'est plus necessaire : les jetons sont verifies avec les
# cles publiques (JWKS). Il ne sert que pour les anciens projets en HS256.

[vars]
SUPABASE_URL = "https://drbznjjwqhibvnnbkkul.supabase.co"
ALLOWED_ORIGIN = "https://to-cloud.pages.dev"

# Canal ou deposer les sauvegardes. A defaut, le canal principal est utilise ;
# un canal separe vaut mieux : une sauvegarde perdue avec les fichiers ne sert
# a rien.
# BACKUP_CHANNEL_ID = "-100xxxxxxxxxx"

# Reveil quotidien de Supabase, et sauvegarde des metadonnees le dimanche.
[triggers]
crons = ["17 3 * * *"]
