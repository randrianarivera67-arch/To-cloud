name: Build Android APK

# Se declenche a la main, ou sur un tag v*
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dependances
        run: npm install

      - name: Construire le site
        run: npm run build
        env:
          # Ces trois valeurs sont figees dans le bundle au moment du build.
          # Si l'une manque, l'APK affiche l'ecran « Configuration incomplete »
          # ou echoue avec « Failed to fetch ».
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Verifier que le bundle est configure
        run: |
          if grep -rq "supabase.co" dist/assets/*.js; then
            echo "Configuration presente dans le bundle."
          else
            echo "::error::Les variables VITE_SUPABASE_* sont absentes du build."
            exit 1
          fi

      - name: Preparer le projet Android
        run: |
          npx cap add android || npx cap sync android
          npx cap sync android

      # Le retour de connexion Google passe par mg.tocloud.app://
      - name: Declarer le schema de lien profond
        run: node scripts/patch-manifest.mjs

      # Icone et ecran de demarrage a partir de resources/
      - name: Generer les icones
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#F6F4FB" --splashBackgroundColor "#F6F4FB"

      - name: Compiler l'APK de debogage
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: to-cloud-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Version signee : uniquement si un certificat est fourni.
      # `secrets` ne s'utilise pas dans `if`, on passe donc par une sortie d'etape.
      - name: Verifier la presence du certificat
        id: cert
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparer le certificat
        if: steps.cert.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/tocloud.jks

      - name: Compiler l'APK signe
        if: steps.cert.outputs.present == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/tocloud.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Publier l'APK signe
        if: steps.cert.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: to-cloud-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
